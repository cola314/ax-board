<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>미나 비서</title>
<style>
:root { --bg:#f5f6f8; --panel:#fff; --fg:#1b2130; --mute:#6b7383; --line:#e3e6eb;
        --teams:#5b5fc7; --teams-bg:#eef0ff; --mina:#0f8a6c; --mina-bg:#e9f7f2; --me:#2563eb; --me-fg:#fff; }
@media (prefers-color-scheme: dark) {
  :root { --bg:#121419; --panel:#1b1e25; --fg:#e7e9ee; --mute:#8b93a3; --line:#2a2e38;
          --teams:#9a9df5; --teams-bg:#23253a; --mina:#45c9a3; --mina-bg:#16302a; --me:#3b74e8; --me-fg:#fff; }
}
* { box-sizing:border-box; }
[hidden] { display:none !important; }
.news.dup { display:none; }
.news.open-dup { margin-left:14px; opacity:.85; }
.stmenu .del { color:#ef4444; border-top:1px solid var(--line) !important; }
.news .who .more { margin-left:6px; background:var(--bg); border:1px solid var(--line); color:var(--mute); border-radius:999px; font:inherit; font-size:11px; padding:0 7px; cursor:pointer; }
/* 👀 확인 필요: 헤더엔 개수 알약(누르면 현황판 카드로), 목록은 현황판 맨 위 노란 카드 */
#needs { margin-left:auto; flex:none; }
#needs .nh { background:#f59e0b; color:#1f1300; border:0; border-radius:999px; padding:3px 12px; font:inherit; font-size:12.5px; font-weight:700; cursor:pointer; user-select:none; }
#needs .nh:hover { filter:brightness(1.08); }
.card.need { grid-column:1 / -1; background:#fef3c7; border-color:#fde68a; color:#78350f; }
@media (prefers-color-scheme: dark) { .card.need { background:#3b2f12; border-color:#5c4a1a; color:#fde68a; } }
.card.need h3 small { color:inherit; opacity:.75; }
.card.need .it { border-top-color:rgba(0,0,0,.08); }
.card .it .go { flex:none; background:#f59e0b; color:#1f1300; border:0; border-radius:999px; padding:2px 10px; font:inherit; font-size:12px; font-weight:700; cursor:pointer; user-select:none; }
.toggle { display:inline-flex; align-items:center; gap:6px; cursor:pointer; padding:2px 6px; margin:-2px 0 -2px -4px; border-radius:6px; }
.toggle:hover { background:var(--bg); }
/* 누르는 영역(접기 묶음·소식 카드·경계선·레일)은 연속 클릭해도 글자가 선택되지 않게. 펼친 소식 본문은 복사할 수 있게 둔다 */
.toggle, nav .sh, .news .who, .news .sub, .split, body.rail nav, .seg, .pbtn, .quick button, .actions button { user-select:none; -webkit-user-select:none; }
/* 스크롤바: 얇고 둥글게, 평소엔 흐리게 */
* { scrollbar-width:thin; scrollbar-color:color-mix(in srgb, var(--mute) 45%, transparent) transparent; }
::-webkit-scrollbar { width:8px; height:8px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:color-mix(in srgb, var(--mute) 35%, transparent); border-radius:999px; border:2px solid transparent; background-clip:padding-box; }
::-webkit-scrollbar-thumb:hover { background:color-mix(in srgb, var(--mute) 65%, transparent); background-clip:padding-box; }
::-webkit-scrollbar-button { display:none; height:0; width:0; }
::-webkit-scrollbar-corner { background:transparent; }
html, body { height:100%; }
body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.55 "Pretendard","Malgun Gothic",system-ui,sans-serif; display:flex; flex-direction:column; }
header { padding:10px 16px; border-bottom:1px solid var(--line); background:var(--panel); display:flex; align-items:center; gap:10px; flex-wrap:nowrap; min-width:0; }
header h1 { flex:none; } #status { min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
header h1 { font-size:15px; margin:0; display:flex; align-items:center; gap:6px; }
.dot { width:8px; height:8px; border-radius:50%; background:var(--mute); }
.dot.on { background:#22c55e; } .dot.off { background:#ef4444; } .dot.busy { background:#eab308; }
#status { color:var(--mute); font-size:12px; }
/* 3단: [소식 사이드바] [메인 패널 | 경계선 | 대화] */
.shell { flex:1; min-height:0; display:flex; position:relative; }
.wrap { flex:1; min-width:0; min-height:0; display:grid; grid-template-columns:minmax(0, 1fr) 6px var(--chatw, minmax(320px, 36%)); }
/* 메인 패널 ↔ 대화 경계선: 끌어서 크기 조절(넓으면 좌우, 좁으면 위아래) */
.split { background:transparent; cursor:col-resize; position:relative; touch-action:none; }
.split::before { content:""; position:absolute; inset:0 2.5px; background:var(--line); border-radius:1px; transition:background .15s, inset .15s; }
.split::after { content:""; position:absolute; left:50%; top:50%; width:4px; height:28px; transform:translate(-50%, -50%); border-radius:2px;
  background:radial-gradient(circle, var(--mute) 1.2px, transparent 1.6px) 0 0 / 4px 6px; opacity:.55; transition:opacity .15s; }
.split:hover::before, .split.drag::before { inset:0 2px; background:color-mix(in srgb, var(--mute) 70%, transparent); }
.split:hover::after, .split.drag::after { opacity:0; }
aside { background:var(--panel); display:flex; flex-direction:column; min-height:0; min-width:0; }
aside h2, nav .sh { font-size:12px; color:var(--mute); font-weight:400; margin:0; padding:8px 10px 8px 6px; background:var(--panel); display:flex; align-items:center; gap:6px; border-bottom:1px solid var(--line); min-height:41px; }
.sp { flex:1; }
/* 왼쪽 소식 사이드바. 접으면 44px 레일(📥 + 안읽음 수만) */
nav { width:300px; flex:none; border-right:1px solid var(--line); background:var(--panel); display:flex; flex-direction:column; min-height:0; container-type:inline-size; }
nav .sh .title { font-weight:600; color:var(--fg); }
nav .icon { font-size:14px; padding:2px 4px; }
body.rail nav { width:44px; cursor:pointer; }
body.rail nav .sh { flex-direction:column; gap:4px; padding:8px 0; border-bottom:0; }
body.rail nav .sh > :not(.toggle), body.rail nav .toggle > .title, body.rail nav .toggle > #newsn, body.rail .fseg { display:none; }
body.rail #news { display:none; }
@container (max-width: 290px) { #newsn { display:none; } }
.pbtn { background:none; border:1px solid transparent; color:var(--mute); font:inherit; font-size:11.5px; cursor:pointer; padding:2px 6px; border-radius:6px; }
.pbtn:hover { border-color:var(--line); color:var(--fg); }
.pbtn.on { background:var(--fg); color:var(--bg); }
.seg { display:flex; gap:2px; background:var(--bg); border-radius:8px; padding:2px; }
.seg .pbtn { font-size:12px; padding:2px 10px; }
.seg .badge { margin-left:4px; }
/* 좁아져도 줄바꿈하지 않는다: 글자는 한 줄 고정, 더 좁으면 아이콘만 */
.pbtn, .seg, aside h2 > *, nav .sh > * { white-space:nowrap; flex-shrink:0; }
aside h2, nav .sh { flex-wrap:nowrap; overflow:hidden; }
aside { container-type:inline-size; }
@container (max-width: 300px) { .seg .lbl { display:none; } .seg .pbtn { padding:2px 8px; } }
.badge { background:#ef4444; color:#fff; border-radius:999px; font-size:10.5px; font-weight:700; padding:0 6px; line-height:16px; }
#news { flex:1; overflow-y:auto; min-height:0; }
.mgitview { flex:1; border:0; width:100%; min-height:0; background:#fff; }
/* 메인 패널 뷰 전환: 현황 / mgit (소식은 왼쪽 사이드바) */
body:not(.view-status) #board, body:not(.view-mgit) #mgit { display:none !important; }
#board { flex:1; overflow-y:auto; min-height:0; padding:10px; display:grid; grid-template-columns:repeat(auto-fill, minmax(260px, 1fr)); gap:10px; align-content:start; }
.card { background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:8px 10px; min-width:0; }
.card h3 { font-size:12.5px; margin:0 0 6px; display:flex; gap:6px; align-items:baseline; }
.card h3 small { color:var(--mute); font-weight:400; margin-left:auto; }
/* 현황 한 줄 = [앞 꼬리표][제목 한 줄 말줄임][오른쪽 칩] — 훑어보기용 */
.card .it { font-size:12.5px; padding:4px 0; border-top:1px solid var(--line); display:flex; align-items:center; gap:6px; min-width:0; }
.card .it:first-of-type { border-top:0; }
.card .it .k { font-weight:700; flex:none; font-variant-numeric:tabular-nums; }
.card .it .t { flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.card .it a { color:var(--fg); text-decoration:none; } .card .it a:hover { text-decoration:underline; }
.card .it .r { flex:none; display:flex; gap:4px; align-items:center; color:var(--mute); font-size:11.5px; }
.chip2 { border-radius:999px; padding:0 7px; font-size:11px; line-height:18px; background:var(--panel); border:1px solid var(--line); color:var(--mute); white-space:nowrap; }
.chip2.ok { color:#fff; background:#16a34a; border-color:#16a34a; } .chip2.bad { color:#fff; background:#ef4444; border-color:#ef4444; } .chip2.warn { color:#92400e; background:#fef3c7; border-color:#fde68a; }
.card .none { color:var(--mute); font-size:12px; }
.card .more { font-size:11.5px; color:var(--mute); background:none; border:0; padding:4px 0 0; cursor:pointer; font:inherit; }
.news { padding:8px 14px; border-top:1px solid var(--line); cursor:pointer; }
.news:hover { background:var(--bg); }
.news.unread { border-left:3px solid #ef4444; padding-left:11px; }
.news.unread .who::after { content:""; display:inline-block; width:7px; height:7px; border-radius:50%; background:#ef4444; margin-left:6px; vertical-align:middle; }
.news .who { font-weight:600; font-size:13px; }
.news .sub { font-size:11.5px; color:var(--mute); display:flex; gap:6px; }
.news .tx { font-size:12.5px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.news .st { font-size:11px; color:var(--mina); }
/* 소식 상태 칩(오른쪽 위)과 고르는 메뉴 */
.news { position:relative; }
.news .who { padding-right:74px; }
.stchip { position:absolute; top:7px; right:10px; font-size:11px; line-height:18px; padding:0 7px; border-radius:999px; border:1px solid var(--line); background:var(--panel); color:var(--mute); cursor:pointer; user-select:none; white-space:nowrap; }
.stchip:hover { color:var(--fg); }
.stchip.doing { color:#b45309; border-color:#f59e0b; background:#fef3c7; }
.stchip.review { color:#1d4ed8; border-color:#93c5fd; background:#dbeafe; }
.stchip.done { color:#15803d; border-color:#86efac; background:#dcfce7; }
.stchip.skip { opacity:.6; }
.stmenu { position:absolute; top:28px; right:8px; z-index:30; background:var(--panel); border:1px solid var(--line); border-radius:8px; box-shadow:0 6px 20px rgba(0,0,0,.25); padding:4px; display:flex; flex-direction:column; min-width:118px; }
.stmenu button { background:none; border:0; color:var(--fg); font:inherit; font-size:12px; text-align:left; padding:4px 8px; border-radius:6px; cursor:pointer; white-space:nowrap; }
.stmenu button:hover, .stmenu button.on { background:var(--bg); }
.news.st-done, .news.st-skip { opacity:.55; }
/* 사이드바 필터 [할 일 | 전체] — 제목 줄 안 작은 세그먼트 */
.fseg { display:inline-flex; background:var(--bg); border-radius:7px; padding:1px; gap:1px; margin-left:2px; }
.fseg button { background:none; border:0; color:var(--mute); font:inherit; font-size:11px; padding:1px 7px; border-radius:6px; cursor:pointer; white-space:nowrap; user-select:none; }
.fseg button.on { background:var(--fg); color:var(--bg); }
body.f-todo .news.st-done, body.f-todo .news.st-skip { display:none; }
@container (max-width: 290px) { .fseg .lbl { display:none; } }
.chatcol { display:flex; flex-direction:column; min-height:0; position:relative; }
/* 메인 접기: 메인 패널(현황/mgit)·경계선만 숨기고 [소식] + [대화] 로 */
#chatmax { position:absolute; top:8px; right:12px; z-index:5; background:var(--panel); border:1px solid var(--line); color:var(--mute); border-radius:8px; padding:2px 8px; font:inherit; font-size:12px; cursor:pointer; opacity:.75; user-select:none; }
#chatmax:hover { opacity:1; color:var(--fg); }
body.chat-max aside, body.chat-max .split { display:none !important; }
body.chat-max .wrap { grid-template-columns:1fr !important; grid-template-rows:1fr !important; }
#backdrop { display:none; }
@media (max-width: 720px) {
  /* 좁으면 사이드바는 레일로 두고, 누르면 메인 위를 덮는 서랍으로 연다 */
  nav { width:44px; cursor:pointer; }
  nav .sh { flex-direction:column; gap:4px; padding:8px 0; border-bottom:0; }
  nav .sh > :not(.toggle), nav .toggle > .title, nav .toggle > #newsn, nav .fseg { display:none; }
  nav #news { display:none; }
  body.drawer nav { position:absolute; z-index:20; inset:0 auto 0 0; width:min(320px, 86vw); cursor:default; box-shadow:4px 0 24px rgba(0,0,0,.35); }
  body.drawer nav .sh { flex-direction:row; gap:6px; padding:8px 10px 8px 6px; border-bottom:1px solid var(--line); }
  body.drawer nav .sh > * { display:revert !important; }
  body.drawer nav .sh .sp { display:block !important; }
  body.drawer nav #news { display:block; }
  body.drawer #backdrop { display:block; position:absolute; inset:0; z-index:19; background:rgba(0,0,0,.35); }
  .wrap { grid-template-columns:1fr; grid-template-rows:minmax(120px, 35%) 1fr; } aside { border-bottom:1px solid var(--line); }
  .wrap { grid-template-rows:var(--mainh, minmax(0, 55%)) 6px 1fr; }
  .split { cursor:row-resize; }
  .split::before { inset:2.5px 0; } .split:hover::before, .split.drag::before { inset:1.5px 0; }
  .split::after { width:28px; height:4px; background-size:6px 4px; }
}
main { flex:1; overflow-y:auto; padding:14px 16px 8px; display:flex; flex-direction:column; gap:10px; }
.row { display:flex; flex-direction:column; max-width:min(680px, 92%); }
.row.user { align-self:flex-end; align-items:flex-end; }
.meta { font-size:11.5px; color:var(--mute); margin:0 4px 2px; display:flex; gap:6px; flex-wrap:wrap; }
.meta b { color:var(--fg); font-weight:600; }
.chip { background:var(--teams-bg); color:var(--teams); padding:0 6px; border-radius:4px; }
.bubble { padding:8px 12px; border-radius:12px; white-space:pre-wrap; word-break:break-word; }
.teams .bubble { background:var(--panel); border:1px solid var(--line); border-left:4px solid var(--teams); border-radius:8px; }
.mina .bubble { background:var(--mina-bg); border-top-left-radius:4px; }
.session .bubble { background:var(--panel); border:1px dashed var(--line); border-top-left-radius:4px; }
.user .bubble { background:var(--me); color:var(--me-fg); border-top-right-radius:4px; }
.bubble a { color:inherit; }
.actions { display:flex; gap:6px; margin:6px 2px 0; flex-wrap:wrap; }
.actions button { background:var(--panel); border:1px solid var(--line); color:var(--fg); border-radius:999px; padding:2px 10px; font:inherit; font-size:12px; cursor:pointer; }
.actions button:hover { border-color:var(--teams); color:var(--teams); }
.fresh .bubble { animation:flash 2s ease-out; }
@keyframes flash { from { box-shadow:0 0 0 3px var(--teams); } to { box-shadow:0 0 0 0 transparent; } }
.running { padding:6px 16px; background:var(--panel); border-top:1px solid var(--line); font-size:12px; color:var(--mute); display:flex; flex-direction:column; gap:6px; }
.task .tl { display:flex; gap:6px; align-items:center; }
.task .hg { display:inline-block; animation:hg 2s ease-in-out infinite; }
@keyframes hg { 0%, 40% { transform:rotate(0); } 50%, 90% { transform:rotate(180deg); } 100% { transform:rotate(360deg); } }
.task .dots span { animation:blink 1.2s infinite; } .task .dots span:nth-child(2) { animation-delay:.2s; } .task .dots span:nth-child(3) { animation-delay:.4s; }
.task .bar { height:4px; border-radius:2px; background:var(--line); overflow:hidden; margin-top:3px; position:relative; }
.task .bar i { position:absolute; inset:0 auto 0 0; background:var(--mina); border-radius:2px; transition:width .6s ease; }
.task .bar.indet i { width:40% !important; background:linear-gradient(90deg, transparent, var(--mina), transparent); animation:shimmer 1.6s linear infinite; }
@keyframes shimmer { from { left:-40%; } to { left:100%; } }
.task .note { color:var(--fg); }
.typing { align-self:flex-start; color:var(--mute); font-size:12.5px; padding:2px 6px; }
.typing span { animation:blink 1.2s infinite; }
.typing span:nth-child(2) { animation-delay:.2s; } .typing span:nth-child(3) { animation-delay:.4s; }
@keyframes blink { 50% { opacity:.2; } }
.empty { margin:auto; color:var(--mute); text-align:center; }
.empty big { display:block; font-size:28px; margin-bottom:6px; }
form { border-top:1px solid var(--line); background:var(--panel); padding:10px 16px; display:flex; gap:8px; align-items:flex-end; }
textarea { flex:1; min-width:0; resize:none; max-height:120px; padding:8px 12px; border-radius:10px; border:1px solid var(--line); background:var(--bg); color:var(--fg); font:inherit; }
textarea:focus { outline:2px solid var(--mina); outline-offset:-1px; }
form button { padding:8px 16px; border:0; border-radius:10px; background:var(--mina); color:#fff; font:inherit; font-weight:600; cursor:pointer; }
form button:disabled { opacity:.5; cursor:default; }
.quick { display:flex; gap:6px; flex-wrap:wrap; padding:8px 16px 0; background:var(--panel); border-top:1px solid var(--line); }
.quick button { background:var(--bg); border:1px solid var(--line); color:var(--fg); border-radius:8px; padding:3px 10px; font:inherit; font-size:12px; cursor:pointer; }
.quick button b { color:var(--mute); font-weight:600; margin-right:4px; }
.quick button:hover { border-color:var(--mina); }
form { border-top:0 !important; }
.hint { font-size:11px; color:var(--mute); padding:0 16px 8px; background:var(--panel); }
</style>
</head>
<body>
<header>
  <h1><span class="dot" id="dot"></span><span id="aname">미나 비서</span></h1>
  <span id="status">연결 중…</span>
  <div id="needs" hidden></div>
</header>
<div class="shell">
<nav id="side">
  <div class="sh">
    <span class="toggle" id="sidetoggle" title="눌러서 접기/펴기"><span id="sidebtn" class="icon">📥</span><span class="title">소식</span><span id="newsn"></span><span id="unread" class="badge" hidden></span></span>
    <span class="fseg" id="fseg"><button type="button" data-f="todo" title="할 일만(완료·무시 숨김)">🗂<span class="lbl"> 할 일</span></button><button type="button" data-f="all" title="전체">≡<span class="lbl"> 전체</span></button></span>
    <span class="sp"></span>
    <button type="button" id="readall" class="pbtn">모두 읽음</button>
    <button type="button" id="clear" class="pbtn">모두 지우기</button>
    <button type="button" id="collapse" class="pbtn" title="접기">«</button>
  </div>
  <div id="news"><div class="news" style="cursor:default;color:var(--mute)">아직 없음</div></div>
</nav>
<div id="backdrop"></div>
<div class="wrap">
<aside>
  <h2>
    <span class="seg" id="seg">
      <button type="button" class="pbtn" data-v="status" title="현황">📋<span class="lbl"> 현황</span></button>
      <button type="button" class="pbtn" data-v="mgit" id="mgitbtn" hidden title="mgit">🔍<span class="lbl"> mgit</span></button>
    </span>
  </h2>
  <div id="board"><div class="none">현황 모으는 중…(최대 1분)</div></div>
  <iframe id="mgit" class="mgitview" hidden title="mgit"></iframe>
</aside>
<div class="split" id="split" title="끌어서 크기 조절 · 두 번 누르면 기본"></div>
<div class="chatcol">
<button type="button" id="chatmax" title="메인 패널(현황/mgit) 접기 · Esc 로 복귀">⇤ 메인 접기</button>
<main id="list"><div class="empty" id="empty"><big>🔔</big>아직 대화가 없습니다<br>왼쪽 소식·가운데 현황을 보면서 아래에 말을 걸어 주세요</div></main>
<div class="running" id="running" hidden></div>
<div class="quick" id="quick"></div>
<form id="f">
  <textarea id="t" rows="1" placeholder="미나에게 말하기" autocomplete="off"></textarea>
  <button id="send">보내기</button>
</form>
</div>
</div>
</div>
<script>
const $ = id => document.getElementById(id);
const list = $("list"), ta = $("t");
let last = 0, lastUser = 0, lastMina = 0;

function linkify(el, text) {

    const a = document.createElement("a"); a.href = m[1]; a.target = "_blank"; a.textContent = m[1]; el.append(a);
    i = m.index + m[1].length;
  }
  el.append(text.slice(i));
}

      render(it, !first && it.kind !== "user");

      if (it.kind === "user") lastUser = it.id;
      if (it.kind === "mina") lastMina = it.id;
    }

    if (first) requestAnimationFrame(() => requestAnimationFrame(() => { pinned = true; toBottom(); }));

    const mins = Math.max(1, Math.round((Date.now() / 1000 - t.started) / 60));
    const has = typeof t.progress === "number";
    // 남은 시간: 일하는 쪽이 준 eta_at 우선. 없으면 30% 이상일 때만 선형 추정을 범위로(0.7~1.5배)
    const now = Date.now() / 1000;
    let eta = "";
    if (t.eta_at) {
      const left = t.eta_at - now;
      eta = left < 0 ? " · 예상보다 늦어짐" : left < 60 ? " · 곧 끝남" : ` · 약 ${Math.round(left / 60)}분 남음`;
    } else if (has && t.progress >= 30 && t.progress < 100) {
      const left = (now - t.started) * (100 - t.progress) / t.progress;
      const a = Math.round(left * 0.7 / 60), b = Math.max(a + 1, Math.round(left * 1.5 / 60));
      eta = b < 1 ? " · 곧 끝남" : ` · 약 ${Math.max(a, 1)}~${b}분`;
    }
    d.querySelector(".tt").textContent = `${t.title} · ${mins}분째` + (has ? ` · ${t.progress}%` : "") + eta + (t.note ? ` · ${t.note}` : "");
    d.querySelector(".bar").classList.toggle("indet", !has);
    d.querySelector(".bar i").style.width = has ? t.progress + "%" : "";
  }
  for (const d of [...$("running").children]) if (!keep.has(d.id.slice(3))) d.remove();
}
// 현황 칸 4개 — 칸마다 한 줄씩, 길면 말줄임, 상태는 오른쪽 칩
function card(title, sec, fill, limit) {
  const c = document.createElement("div"); c.className = "card";
  const h = document.createElement("h3"); h.textContent = title;
  const sm = document.createElement("small"); sm.textContent = sec && sec.at ? sec.at + " 갱신" : ""; h.append(sm); c.append(h);
  if (!sec) { c.insertAdjacentHTML("beforeend", '<div class="none">모으는 중…</div>'); return c; }
  if (sec.error) { const e = document.createElement("div"); e.className = "none"; e.textContent = sec.error; c.append(e); return c; }
  if (!sec.items.length) { c.insertAdjacentHTML("beforeend", '<div class="none">없음</div>'); return c; }
  const rows = sec.items.map(x => { const it = document.createElement("div"); it.className = "it"; fill(it, x); return it; });
  const n = limit || rows.length;
  rows.forEach((r, i) => { r.hidden = i >= n; c.append(r); });
  if (rows.length > n) {
    const m = document.createElement("button"); m.type = "button"; m.className = "more"; m.textContent = `+ ${rows.length - n}개 더`;
    m.onclick = () => { rows.forEach(r => r.hidden = false); m.remove(); };
    c.append(m);
  }
  return c;
}
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function chip(text, cls) { return el("span", "chip2" + (cls ? " " + cls : ""), text); }
function titleCell(text, url) {
  const t = el("span", "t"); t.title = text;
  if (url) { const a = el("a", null, text); a.href = url; a.target = "_blank"; t.append(a); } else t.textContent = text;
  return t;
}
const MERGE = { not_approved: ["승인 대기", ""], can_be_merged: ["머지 가능", "ok"], mergeable: ["머지 가능", "ok"],
  cannot_be_merged: ["충돌", "bad"], conflict: ["충돌", "bad"], broken_status: ["충돌", "bad"], ci_must_pass: ["CI 대기", "warn"],
  ci_still_running: ["CI 도는 중", "warn"], draft_status: ["초안", ""], discussions_not_resolved: ["토론 미해결", "warn"], need_rebase: ["리베이스 필요", "warn"] };
const PIPE = { success: ["✓", "ok"], failed: ["✗ 빌드", "bad"], running: ["… 빌드", "warn"], pending: ["… 빌드", "warn"], canceled: ["취소", ""] };
const DOW = "일월화수목금토";
function whenText(w) {  // "11/03(Tue) 10:15" → "내일 10:15"
  const m = /(\d+)\/(\d+)\S*\s+(\d+:\d+)/.exec(w || ""); if (!m) return w;
  const d = new Date(new Date().getFullYear(), +m[1] - 1, +m[2]), t = new Date(); t.setHours(0, 0, 0, 0);
  const diff = Math.round((d - t) / 864e5);
  return (diff === 0 ? "오늘" : diff === 1 ? "내일" : `${m[1]}/${m[2]}(${DOW[d.getDay()]})`) + " " + m[3];
}
function renderBoard(st) {
  const b = $("board"); b.innerHTML = "";
  b.append(card("🦊 내 MR", st.mrs, (it, m) => {
    it.append(el("span", "k", "!" + m.ref.replace(/^.*!/, "")), titleCell(m.title.replace(/^\S+ (fix|feat|refactor|chore): /, ""), m.url));
    const r = el("span", "r");
    const [ap, need] = String(m.approvals || "0/0").split("/");
    r.append(chip(`승인 ${ap}/${need}`, +ap >= +need && +need > 0 ? "ok" : ""));
    const pp = PIPE[m.pipeline]; if (pp) r.append(chip(pp[0], pp[1]));
    const ms = m.mergeable ? MERGE.can_be_merged : (MERGE[m.merge_status] || [m.merge_status || "대기", ""]);
    if (ms[0] !== "승인 대기") r.append(chip(ms[0], ms[1]));
    it.append(r);
  }));
  b.append(card("🔥 진행 중", st.todo, (it, t) => it.append(titleCell(String(t).split(" — ")[0]))));
  b.append(card("📅 다음 회의", st.meetings, (it, e) => {
    it.append(el("span", "k", whenText(e.when)), titleCell(strip(e.title, UI.meeting_strip)));
    const r = el("span", "r");
    const room = /(\d+-\d+[^ ]*|\d+F[^ ]*) 회의실|(\d+-\d+-\d+)/.exec(e.location || "");
    if (room) r.append(el("span", null, room[0].replace(/ 회의실$/, "")));
    if (e.link) { const a = el("a", null, "🎥"); a.href = e.link; a.target = "_blank"; a.title = "회의 링크"; r.append(a); }
    it.append(r);
  }));
}
// 소식 사이드바: 넓으면 펼침/레일(기억), 좁으면 레일 + 서랍
const narrowView = () => matchMedia("(max-width: 720px)").matches;
function rail(on) {
  document.body.classList.toggle("rail", on);
  try { localStorage.setItem("rail", on ? "1" : ""); } catch {}
}
function drawer(on) { document.body.classList.toggle("drawer", on); }
$("side").addEventListener("click", e => {
  if (narrowView()) { if (!document.body.classList.contains("drawer")) { drawer(true); e.stopPropagation(); } return; }
  if (document.body.classList.contains("rail")) rail(false);
});
// 머리줄의 '📥 소식 N건' 묶음 전체가 접기/펴기 버튼(작은 « 만으로는 누르기 어려워서)
$("sidetoggle").addEventListener("click", e => {
  if (narrowView()) { drawer(!document.body.classList.contains("drawer")); e.stopPropagation(); return; }
  if (!document.body.classList.contains("rail")) { rail(true); e.stopPropagation(); }
});
$("collapse").onclick = e => { e.stopPropagation(); if (narrowView()) drawer(false); else rail(true); };
$("backdrop").onclick = () => drawer(false);
let serverMgit = "";
try {

try { if (localStorage.getItem("rail")) rail(true); } catch {}
$("readall").onclick = () => {
  for (const n of $("news").querySelectorAll(".news.unread")) { n.classList.remove("unread"); readIds.add(+n.dataset.id); }
  saveRead(); countUnread();

  newsCount = 0; $("newsn").textContent = ""; $("unread").hidden = true; document.title = appTitle();

};
loadConfig().finally(() => { buildShort(); poll(true); setInterval(poll, 500); }); ta.focus();
// 경계선 끌기: 넓은 화면은 대화 폭(--chatw), 좁은 화면은 메인 높이(--mainh). 브라우저에 기억
(() => {
  const wrap = document.querySelector(".wrap"), sp = $("split");
  const narrow = () => matchMedia("(max-width: 720px)").matches;
  const apply = () => {
    let v = {}; try { v = JSON.parse(localStorage.getItem("split") || "{}"); } catch {}
    wrap.style.setProperty("--chatw", v.chatw ? v.chatw + "px" : "");
    wrap.style.setProperty("--mainh", v.mainh ? v.mainh + "px" : "");
    if (!v.chatw) wrap.style.removeProperty("--chatw");
    if (!v.mainh) wrap.style.removeProperty("--mainh");
  };
  const save = v => { try { localStorage.setItem("split", JSON.stringify(v)); } catch {} apply(); };
  sp.addEventListener("pointerdown", e => {
    e.preventDefault(); sp.setPointerCapture(e.pointerId); sp.classList.add("drag");
    const r = wrap.getBoundingClientRect();
    const move = ev => {
      let v = {}; try { v = JSON.parse(localStorage.getItem("split") || "{}"); } catch {}
      if (narrow()) v.mainh = Math.round(Math.min(Math.max(ev.clientY - r.top, 80), r.height - 160));
      else v.chatw = Math.round(Math.min(Math.max(r.right - ev.clientX, 260), r.width - 240));
      save(v);
    };
    const up = () => { sp.classList.remove("drag"); sp.removeEventListener("pointermove", move); sp.removeEventListener("pointerup", up); };
    sp.addEventListener("pointermove", move); sp.addEventListener("pointerup", up);
  });
  sp.addEventListener("dblclick", () => save({}));
  apply();
})();
// 대화 크게 보기 토글(기억). Esc 로 복귀
function chatMax(on) {
  document.body.classList.toggle("chat-max", on);
  $("chatmax").textContent = on ? "⇥ 메인 펴기" : "⇤ 메인 접기";
  try { localStorage.setItem("chatMax", on ? "1" : ""); } catch {}
  if (typeof list !== "undefined") list.scrollTop = list.scrollHeight;
}
$("chatmax").onclick = () => chatMax(!document.body.classList.contains("chat-max"));
document.addEventListener("keydown", e => { if (e.key === "Escape" && document.body.classList.contains("chat-max")) chatMax(false); });
try { if (localStorage.getItem("chatMax")) chatMax(true); } catch {}
